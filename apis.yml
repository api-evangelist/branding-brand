aid: branding-brand
name: Branding Brand
description: >-
  Branding Brand is a Pittsburgh-based digital and mobile commerce technology
  company that has built native apps, progressive web apps, and websites for
  enterprise retailers for more than fifteen years. Its public developer surface
  is the open-source Flagship and Flagship Code React Native toolkits — a
  configuration-as-code framework with reusable commerce components, commerce
  data adapters, analytics/CMS modules, and a CLI — published under the
  @brandingbrand npm scope. The company also offers Shipcode, an AI-assisted
  no-code platform for building digital commerce experiences. Branding Brand is
  backed by Insight Partners. It publishes no public REST API or OpenAPI; this
  profile catalogs its open-source packages, CLI, and developer resources.
